name: Style check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan tree for em dashes, en dashes, and emojis
        run: node scripts/style-check.mjs

  pr-text:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';
            const forbidden = new RegExp(
              '[\\u2013\\u2014]|[\\u{1F300}-\\u{1FAFF}]|[\\u{2600}-\\u{27BF}]',
              'u'
            );
            const problems = [];
            if (forbidden.test(title)) {
              problems.push('PR title contains an em dash, en dash, or emoji.');
            }
            if (forbidden.test(body)) {
              problems.push('PR body contains an em dash, en dash, or emoji.');
            }
            if (/co-authored-by:\s*(claude|anthropic|gpt|openai|copilot)/i.test(body)) {
              problems.push('PR body contains AI attribution. See docs/architecture.md.');
            }
            if (problems.length) {
              core.setFailed(problems.join('\n'));
            } else {
              core.info('PR title and body are clean.');
            }

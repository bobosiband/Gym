name: Commit lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          CONVENTIONAL='^(feat|fix|chore|docs|test|refactor|perf|style|build|ci|revert)(\([a-z0-9/_-]+\))?!?: .+$'
          failed=0

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            commits=$(git rev-list "$HEAD_SHA")
          else
            commits=$(git rev-list "$BASE_SHA..$HEAD_SHA")
          fi

          if [ -z "$commits" ]; then
            echo 'No new commits to lint.'
            exit 0
          fi

          for sha in $commits; do
            msg=$(git log -1 --format=%B "$sha")
            subject=$(printf '%s' "$msg" | head -n1)

            if ! printf '%s' "$subject" | grep -Eq "$CONVENTIONAL"; then
              echo "::error::commit $sha: subject does not match Conventional Commits"
              echo "    subject: $subject"
              failed=1
            fi

            if printf '%s' "$msg" | grep -Pq '[\x{2013}\x{2014}]|[\x{1F300}-\x{1FAFF}]|[\x{2600}-\x{27BF}]'; then
              echo "::error::commit $sha: message contains em dash, en dash, or emoji"
              failed=1
            fi

            if printf '%s' "$msg" | grep -Eiq 'co-authored-by:[[:space:]]*(claude|anthropic|gpt|openai|copilot)'; then
              echo "::error::commit $sha: AI attribution trailer is forbidden"
              failed=1
            fi

            if printf '%s' "$msg" | grep -Eiq '(generated|written|produced) with[[:space:]]+(\[?claude|\[?anthropic|\[?copilot)'; then
              echo "::error::commit $sha: AI attribution line is forbidden"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo 'All commits OK.'

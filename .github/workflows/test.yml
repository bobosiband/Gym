name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Python tests
        id: pytests
        shell: bash
        run: |
          if find tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.pytests.outputs.found == 'true'
        with:
          python-version: '3.12'
      - name: Install pytest
        if: steps.pytests.outputs.found == 'true'
        run: pip install pytest
      - name: Run pytest
        if: steps.pytests.outputs.found == 'true'
        run: pytest

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Java tests
        id: javatests
        shell: bash
        run: |
          if find services apps packages -type f -name 'pom.xml' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif find services apps packages -type f -name 'build.gradle*' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.javatests.outputs.found == 'true'
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Run Java tests
        if: steps.javatests.outputs.found == 'true'
        shell: bash
        run: |
          for d in $(find services apps packages -type f -name 'pom.xml' -exec dirname {} \; 2>/dev/null); do
            (cd "$d" && mvn -B test)
          done
          for d in $(find services apps packages -type f -name 'build.gradle*' -exec dirname {} \; 2>/dev/null); do
            (cd "$d" && ./gradlew test)
          done

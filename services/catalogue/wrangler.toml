name = "gym-catalogue"
main = "src/index.ts"
compatibility_date = "2025-10-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
# Default local allow list. Override per environment at deploy time with:
#   wrangler deploy --var ALLOWED_ORIGINS:"https://example.com,https://example.org"
# Comma-separated, no spaces required.
ALLOWED_ORIGINS = "http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "gym-catalogue"
database_id = "64660688-d5b3-47d4-b582-3989181f06a7"
migrations_dir = "migrations"
